name: Deploy HMS.Api

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop and remove previous containers
        run: docker compose down --remove-orphans

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 20); do
            # Check if the API responds with HTTP 200 on Swagger
            status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5180/swagger/index.html || echo "000")
            if [ "$status_code" = "200" ]; then
              echo "hms-api is healthy and responding!"
              exit 0
            fi
            echo "Waiting for hms-api to respond (attempt $i)... HTTP status: $status_code"
            sleep 5
          done
          echo "hms-api did not respond in time"
          exit 1

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show recent logs
        if: always()
        run: docker compose logs --tail=100 hms-api
